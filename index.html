<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Fire Top Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            FREE FIRE <span>TOP UP</span>
        </div>

        <button class="menu-btn">☰</button>
    </header>


    <main>

        <section class="verify-section">

            <div class="verify-card">

                <div class="game-icon">🎮</div>

                <h1>Verify Your UID</h1>

                <p>
                    Enter your Free Fire UID to continue
                </p>

                <label>Player UID</label>

                <input
                    type="text"
                    id="uidInput"
                    placeholder="Enter your UID"
                    maxlength="15"
                >

                <button
                    class="verify-btn"
                    onclick="verifyUID()"
                >
                    VERIFY UID
                </button>

                <div id="errorMessage"></div>
<div id="playerModal" class="modal">

    <div class="player-popup">

        <button class="close-modal" onclick="closePlayerModal()">×</button>

        <div class="verified-badge">
            ✓ VERIFIED ACCOUNT
        </div>

        <div class="player-avatar">
            👤
        </div>

        <h2 id="playerName">Player</h2>

        <p class="verified-text">
            Account verified successfully
        </p>

        <div class="player-info">

            <div>
                <span>UID</span>
                <strong id="playerUID">---</strong>
            </div>

            <div>
                <span>LEVEL</span>
                <strong id="playerLevel">70</strong>
            </div>

            <div>
                <span>REGION</span>
                <strong id="playerRegion">IND</strong>
            </div>

            <div>
                <span>LIKES</span>
                <strong id="playerLikes">---</strong>
            </div>

        </div>

        <button
            class="store-btn"
            onclick="goToStore()"
        >
            PROCEED TO STORE →
        </button>

        <button
            class="reenter-btn"
            onclick="closePlayerModal()"
        >
            Not my account? Re-enter UID
        </button>

    </div>

</div>
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
